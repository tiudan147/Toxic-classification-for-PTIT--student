<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Comment Scraper — Facebook Posts &amp; Comments</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5; margin: 0; padding: 20px;
      max-width: 860px; margin: 0 auto;
    }
    h1 { font-size: 20px; color: #1877f2; margin: 0 0 4px; }
    .sub { color: #65676b; font-size: 13px; margin-bottom: 18px; }
    .card {
      background: #fff; border-radius: 12px; padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.1); margin-bottom: 14px;
    }
    label { font-size: 13px; font-weight: 600; color: #050505; display: block; margin-bottom: 4px; }
    textarea, input[type=number] {
      width: 100%; padding: 8px 10px; border: 1px solid #ccd0d5; border-radius: 8px;
      font-size: 13px; font-family: inherit;
    }
    textarea { height: 110px; resize: vertical; }
    .hint { font-size: 11px; color: #65676b; margin-top: 3px; }
    .row { display: flex; gap: 12px; margin-top: 10px; }
    .row > div { flex: 1; }
    button {
      padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .btn-start { background: #1877f2; color: #fff; }
    .btn-start:hover { background: #166fe5; }
    .btn-start:disabled { background: #9cb4d8; cursor: not-allowed; }
    .btn-stop { background: #fa383e; color: #fff; }
    .btn-stop:hover { background: #d32f2f; }
    .btn-export { background: #42b72a; color: #fff; }
    .btn-export:hover { background: #36a420; }
    .btn-export:disabled { background: #a8cf9d; cursor: not-allowed; }
    #status { font-size: 13px; color: #050505; padding: 8px 0; white-space: pre-wrap; }
    .progress {
      height: 8px; background: #e4e6eb; border-radius: 4px; overflow: hidden; margin-top: 8px;
    }
    .progress > div { height: 100%; background: #1877f2; width: 0%; transition: width .3s; }
    #results { font-size: 13px; }
    .post-item { border-bottom: 1px solid #e4e6eb; padding: 10px 0; }
    .post-url { color: #1877f2; font-size: 12px; word-break: break-all; }
    .post-content { color: #050505; margin: 4px 0; white-space: pre-wrap; max-height: 80px; overflow: hidden; }
    .post-meta { color: #65676b; font-size: 11px; }
    .comment { margin-left: 16px; padding: 4px 0; border-left: 2px solid #e4e6eb; padding-left: 8px; }
    .comment b { color: #050505; font-size: 12px; }
    .comment span { color: #050505; font-size: 12px; }
    .summary { background: #e7f3ff; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Facebook Comment Scraper</h1>
  <div class="sub">Cào bài viết + tất cả bình luận từ danh sách group/page Facebook. Tự dừng 30s (mặc định) giữa các URL — giữ nguyên cơ chế Smart Delays của extension gốc.</div>

  <div class="card">
    <label>Danh sách URL (mỗi dòng 1 link group/page Facebook)</label>
    <textarea id="urls" placeholder="https://www.facebook.com/groups/xxxxxxxx&#10;https://www.facebook.com/groups/yyyyyyyy"></textarea>
    <div class="hint">Có thể dán link bài viết cụ thể nếu chỉ muốn cào 1 bài + comments của bài đó.</div>

    <div class="row">
      <div>
        <label>Scroll tối đa (tải thêm bài)</label>
        <input type="number" id="maxScrolls" value="10" min="0" max="200" />
      </div>
      <div>
        <label>Chờ giữa 2 URL (giây)</label>
        <input type="number" id="timeInSeconds" value="30" min="0" max="3600" />
      </div>
      <div>
        <label>Click mở thêm comments (tối đa)</label>
        <input type="number" id="maxCommentClicks" value="30" min="0" max="200" />
      </div>
      <div>
        <label>Cào comments</label>
        <select id="withComments" style="width:100%;padding:8px 10px;border:1px solid #ccd0d5;border-radius:8px;font-size:13px;">
          <option value="yes" selected>Có — cào cả comments</option>
          <option value="no">Không — chỉ cào posts</option>
        </select>
      </div>
    </div>

    <div style="margin-top:14px;display:flex;gap:10px;">
      <button id="btnStart" class="btn-start">▶ Start Scraping</button>
      <button id="btnStop" class="btn-stop">■ Stop</button>
      <button id="btnJson" class="btn-export" disabled>⬇ JSON</button>
      <button id="btnCsv" class="btn-export" disabled>⬇ CSV</button>
    </div>

    <div id="status"></div>
    <div id="liveCounters" style="font-size:13px;color:#1877f2;font-weight:600;padding:4px 0;"></div>
    <div class="progress"><div id="progressBar"></div></div>
    <div style="margin-top:10px;">
      <label style="font-size:11px;color:#65676b;">Log (15 dòng cuối — xem cả trong console cửa sổ scraper)</label>
      <pre id="logTail" style="background:#f7f8fa;border:1px solid #e4e6eb;border-radius:8px;padding:8px;font-size:11px;max-height:180px;overflow:auto;white-space:pre-wrap;color:#333;"></pre>
    </div>
  </div>

  <div class="card">
    <div id="results"></div>
  </div>

<script src="lib/scraper-core.js"></script>
<script src="scraper.js"></script>
</body>
</html>
